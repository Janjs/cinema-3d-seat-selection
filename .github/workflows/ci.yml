name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_HOOK_URL" ]; then
            echo "Skipping deploy: COOLIFY_DEPLOY_HOOK_URL is not set."
            exit 0
          fi

          curl -fsSL -X POST "$COOLIFY_DEPLOY_HOOK_URL"
